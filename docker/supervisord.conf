[supervisord]
nodaemon=true
user=wine
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


[program:startup_guard]
command=bash /opt/metabridge5/startup_guard.sh
priority=0
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x16
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vnc_passwd_setup]
command=bash /opt/metabridge5/vnc_passwd_setup.sh
priority=2
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :1 -passwdfile /home/wine/.vnc/passwdfile -forever -shared
priority=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wine]
command=bash /opt/metabridge5/terminal_wrapper.sh
priority=4
autorestart=true
stopwaitsecs=15
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree,mshtml,winemenubuilder.exe=disabled",WINEDEBUG="-all",TZ="UTC"
stdout_logfile=/home/wine/wine_stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/home/wine/wine_stderr.log
stderr_logfile_maxbytes=10MB

[program:api]
command=wine M:\\python\\python.exe M:\\daemon\\grpc_server.py 50051
priority=5
autorestart=true
directory=/opt/metabridge5/daemon
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree,mshtml,winemenubuilder.exe=disabled",WINEDEBUG="-all",TZ="UTC"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /etc/supervisor/conf.d/*.conf
