[supervisord]
nodaemon=true
user=wine
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wine]
command=wine C:\\MetaTrader5\\terminal64.exe /portable
priority=3
autorestart=true
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled",WINEDEBUG="err+all",TZ="UTC"
stdout_logfile=/home/wine/wine_stdout.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/home/wine/wine_stderr.log
stderr_logfile_maxbytes=10MB

[program:api]
command=wine C:\\python\\python.exe -m uvicorn main:app --host 0.0.0.0 --port 8000
priority=4
autorestart=true
directory=/home/wine/app/api
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled",TZ="UTC"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dismisser]
command=bash /home/wine/dismiss_dialogs.sh
priority=5
autorestart=true
environment=DISPLAY=":1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
