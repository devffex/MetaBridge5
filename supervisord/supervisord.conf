[supervisord]
nodaemon=true
user=wine
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
priority=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared
priority=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wine]
command=wine C:\\MetaTrader5\\terminal64.exe /portable
priority=3
autorestart=true
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
