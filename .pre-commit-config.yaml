repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format Check
        entry: uv run --project api ruff format --check
        language: system
        files: ^api/
        pass_filenames: false

      - id: ruff-lint
        name: Ruff Lint Check
        entry: uv run --project api ruff check
        language: system
        files: ^api/
        pass_filenames: false

      - id: pytest
        name: Run Pytest
        entry: uv run --project api pytest
        language: system
        files: ^api/
        pass_filenames: false
        always_run: true
