services:
  core:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    image: metabridge5-core:latest
    container_name: metabridge5-core
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:5900:5900"   # VNC Remote Desktop (MetaTrader 5 visual setup/auth)
    environment:
      - METABRIDGE5_API_KEY=${METABRIDGE5_API_KEY:-dev_metabridge5_secret_key_123}
      - VNC_PASSWORD=${VNC_PASSWORD:-metabridge5pass}
      - START_VNC=${START_VNC:-false}
      - TZ=UTC
      - WINEDEBUG=-all
    volumes:
      - mt5_account:/home/wine/.wine
    networks:
      - metabridge5
    healthcheck:
      test: ["CMD", "/opt/metabridge5/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  market-gateway:
    build:
      context: apps/market-gateway
      dockerfile: Dockerfile
    image: metabridge5-market-gateway:latest
    container_name: metabridge5-market-gateway
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      core:
        condition: service_started
    ports:
      - "8000:8000"   # Market Gateway REST, WebSockets & Prometheus Telemetry (/metrics)
    environment:
      - TERMINAL_GRPC_HOST=core
      - TERMINAL_GRPC_PORT=50051
      - METABRIDGE5_DATA_DIR=/data
      - METABRIDGE5_API_KEY=${METABRIDGE5_API_KEY:-dev_metabridge5_secret_key_123}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - GITHUB_CDN_BASE_URL=${GITHUB_CDN_BASE_URL:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-metabridge5-market-data}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_CDN_BASE_URL=${S3_CDN_BASE_URL:-}
      - AUDIT_LOG_SINK=${AUDIT_LOG_SINK:-sqlite}
      - AUDIT_EXTERNAL_ENDPOINT=${AUDIT_EXTERNAL_ENDPOINT:-}
      - AUDIT_EXTERNAL_API_KEY=${AUDIT_EXTERNAL_API_KEY:-}
      - TZ=UTC
    volumes:
      - market_data:/data
    networks:
      - metabridge5
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  duckdb-analytics:
    build:
      context: apps/duckdb-analytics
      dockerfile: Dockerfile
    image: metabridge5-duckdb-analytics:latest
    container_name: metabridge5-duckdb-analytics
    restart: unless-stopped
    depends_on:
      market-gateway:
        condition: service_started
    ports:
      - "8005:8005"   # Analytics REST Query API
    environment:
      - METABRIDGE5_DATA_DIR=/data
      - PORT=8005
      - TZ=UTC
    volumes:
      - market_data:/data:ro
    networks:
      - metabridge5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8005/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup-sync:
    build:
      context: apps/backup-sync
      dockerfile: Dockerfile
    image: metabridge5-backup-sync:latest
    container_name: metabridge5-backup-sync
    restart: unless-stopped
    depends_on:
      core:
        condition: service_started
    volumes:
      - mt5_account:/source:ro
      - market_data:/data:ro
    networks:
      - metabridge5
    environment:
      - VOLUME_MOUNT=/source
      - PARQUET_DIR=/data/parquet
      - TZ=UTC
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-metabridge5-market-data}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mt5_account:
    name: metabridge5_mt5_account
  market_data:
    name: metabridge5_market_data

networks:
  metabridge5:
    name: metabridge5_net
    driver: bridge
