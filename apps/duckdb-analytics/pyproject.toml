[project]
name = "metabridge5-duckdb-analytics"
version = "0.1.0"
description = "High-performance zero-copy DuckDB analytical engine for partitioned Parquet datasets"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httptools>=0.6.0",
    "uvloop>=0.19.0",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

