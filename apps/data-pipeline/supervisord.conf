[program:pipeline]
command=wine C:\\python\\python.exe -u main.py
priority=5
autorestart=false
startsecs=5
directory=/home/wine/app/pipeline
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled",TZ="UTC"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:autoshutdown]
command=bash -c "while read line; do if echo \"$line\" | grep -q \"PROCESS_STATE_EXITED\"; then kill -15 $(pgrep supervisord); fi; done"
events=PROCESS_STATE_EXITED
