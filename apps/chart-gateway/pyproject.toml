[project]
name = "savisor-chart-gateway"
version = "0.1.0"
description = "High-performance pass-through charting gateway for TradingView"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "websockets>=12.0",
    "cachetools>=5.3.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "PyGithub>=2.2.0",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
exclude = ["*pb2*.py"]

[tool.ruff.lint]
ignore = ["BLE001", "G004", "TRY003", "EM101", "EM102", "D", "ANN", "COM812", "ISC001"]


