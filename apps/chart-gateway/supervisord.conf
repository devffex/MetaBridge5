[program:chart-gateway]
command=python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
priority=6
autorestart=true
directory=/home/wine/app/chart-gateway
environment=SAVISOR_API_KEY="%(ENV_SAVISOR_API_KEY)s",MT5_GRPC_SERVER="127.0.0.1:50051"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
