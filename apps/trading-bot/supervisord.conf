[program:bot]
command=wine C:\\python\\python.exe -u main.py
priority=5
autorestart=true
directory=/home/wine/app/bot
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled",TZ="UTC"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
