[program:api]
command=wine C:\\python\\python.exe -m uvicorn main:app --host 0.0.0.0 --port 8000
priority=5
autorestart=true
directory=/home/wine/app/api
environment=DISPLAY=":1",WINEPREFIX="/home/wine/.wine",WINEARCH="win64",WINEDLLOVERRIDES="mscoree=disabled",TZ="UTC"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
